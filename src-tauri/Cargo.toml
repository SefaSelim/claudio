[package]
name = "claudio-ofis"
version = "0.6.0"
description = "Claude Code ajanlarını masaüstünde küçük bir ofiste gösterir"
edition = "2021"

[lib]
name = "claudio_ofis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
