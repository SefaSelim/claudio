# Label set for issues and pull requests.
# Every issue/PR gets one `type:` label and at least one `area:` label.
# Sync with gh once it is installed, e.g. for each entry:
#   gh label create "<name>" --color <color> --description "<description>" --force

# Type
- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as intended"
- name: "type: feature"
  color: "0e8a16"
  description: "New user-facing capability"
- name: "type: enhancement"
  color: "a2eeef"
  description: "Improvement to an existing feature"
- name: "type: docs"
  color: "0075ca"
  description: "README, CHANGELOG or other documentation"
- name: "type: refactor"
  color: "c5def5"
  description: "Code change with no behaviour change"
- name: "type: performance"
  color: "fbca04"
  description: "Speed, memory or GPU usage"
- name: "type: chore"
  color: "ededed"
  description: "Build, dependencies, tooling, releases"

# Area
- name: "area: bridge"
  color: "5319e7"
  description: "Node sidecar: hook receiver, session list, transcript, waiter"
- name: "area: hooks"
  color: "7057ff"
  description: "Claude Code hook installation and hook behaviour"
- name: "area: ui"
  color: "e0703a"
  description: "Panels, cards, side bar, chat"
- name: "area: scene"
  color: "f9a66c"
  description: "three.js office, characters, animation, lighting"
- name: "area: window"
  color: "bfd4f2"
  description: "Tauri shell: transparency, click-through, positioning"
- name: "area: build"
  color: "d4c5f9"
  description: "Tooling, packaging, CI"

# Roadmap phase
- name: "phase: 2 office"
  color: "fef2c0"
  description: "Cozy office, desks, meeting room"
- name: "phase: 3 agent card"
  color: "fef2c0"
  description: "Agent panel, steps, notifications"
- name: "phase: 4 questions"
  color: "fef2c0"
  description: "Question and permission cards"
- name: "phase: 5 meetings"
  color: "fef2c0"
  description: "Meeting setup, choreography, summaries"
- name: "phase: 6 polish"
  color: "fef2c0"
  description: "Sound, multi-session, autostart, packaging"

# Status
- name: "status: needs triage"
  color: "ffffff"
  description: "Not reviewed yet"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on something outside this repo"
- name: "status: needs verification"
  color: "fbca04"
  description: "Implemented but not yet tested on a real session"
