<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claudio Ofis</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- Pencere tamamen şeffaf. Sadece data-hit taşıyan öğeler tıklanır, gerisi alttaki pencereye geçer. -->
  <div class="stack" id="stack">
    <div class="requests" id="requests"></div>
    <div id="panel"></div>
  </div>

  <div class="office" id="office" data-hit>
    <canvas id="scene"></canvas>
    <div class="tags" id="tags"></div>
    <div class="modebadge" id="modebadge"><i class="dot"></i><span>Oturum kapalı</span></div>
  </div>

  <nav class="dock" id="dock" data-hit>
    <div class="grp">
      <button class="dk grip" id="grip" aria-label="Ofisi taşı">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="4" r="1.3"/><circle cx="10" cy="4" r="1.3"/><circle cx="6" cy="8" r="1.3"/><circle cx="10" cy="8" r="1.3"/><circle cx="6" cy="12" r="1.3"/><circle cx="10" cy="12" r="1.3"/></svg>
        <span class="tip">Sürükle: taşı · Çift tık: sağ alta dön</span>
      </button>
      <button class="dk" data-open="session" aria-label="Oturum">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.8 2.8 0 014 4l-1 1M9 11.5l-1 1a2.8 2.8 0 01-4-4l1-1"/></svg>
        <i class="condot"></i>
        <span class="tip">Oturum</span>
      </button>
      <button class="dk" data-open="chat" aria-label="Claude'a yaz">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
        <span class="badge" hidden></span>
        <span class="tip">Claude'a yaz</span>
      </button>
    </div>
    <div class="grp">
      <button class="dk gear" data-open="settings" aria-label="Ayarlar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        <span class="tip">Ayarlar</span>
      </button>
      <button class="dk" id="quit" aria-label="Kapat">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        <span class="tip">Ofisi kapat</span>
      </button>
    </div>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
