name: Release

# Pushing a vX.Y.Z tag builds the Windows installers and attaches them to a draft
# GitHub release whose notes are that version's CHANGELOG section. Publish the draft
# by hand once the installers look right.
#
# The release can also be started from the Actions tab (Run workflow) with a version
# such as 0.13.0. The run then checks that package.json carries that version, creates
# the annotated vX.Y.Z tag on the commit it runs on, and builds the same draft release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.13.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::package.json is at $actual, not $VERSION. Cut the release commit first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists; tags are never moved."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary=$(node scripts/release-notes.mjs "$VERSION" | sed -n '1p')
          git tag -a "$TAG" -m "$TAG: $summary"
          git push origin "$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Release notes from CHANGELOG
        shell: bash
        run: node scripts/release-notes.mjs "${TAG#v}" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
